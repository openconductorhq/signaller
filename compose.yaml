# docker compose up -d --build   (config stays in ~/.config/claude-router; stats in the "stats" volume)
services:
  router:
    build: .
    image: claude-router
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]  # this machine only
    env_file: ${HOME}/.config/claude-router/env
    environment:  # wins over the env file
      CLAUDE_ROUTER_LISTEN: 0.0.0.0:8787
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${HOME}/.config/claude-router:/config
      # stats.db on the VM's own disk: SQLite over a host-shared folder (virtiofs) corrupted it twice
      - stats:/data
      - ${HOME}/.claude/projects:/claude/projects:ro  # session labels (cwd, branch) only
volumes:
  stats:
