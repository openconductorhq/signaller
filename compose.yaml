# docker compose up -d --build   (config stays in ~/.config/signaller; stats in the "signaller_stats" volume)
name: signaller
services:
  router:
    build: .
    image: signaller
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]  # this machine only
    env_file: ${HOME}/.config/signaller/env
    environment:  # wins over the env file
      SIGNALLER_LISTEN: 0.0.0.0:8787
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${HOME}/.config/signaller:/config
      # stats.db on the VM's own disk: SQLite over a host-shared folder (virtiofs) corrupted it twice
      - stats:/data
      - ${HOME}/.claude/projects:/claude/projects:ro  # session labels and (training) prompt text
# The settings lines' `hour` field and the console clock read the container's local time: set
# TZ=<Area/City> in the env file (under Colima the host's /etc/localtime isn't shared into the VM;
# an unset or empty TZ means UTC). The console shows the zone the router uses.
volumes:
  stats:
